name: Scraper diario Cyberpuerta

on:
  schedule:
    # 03:00 UTC = 21:00 (9 pm) CDMX (UTC-6)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================
      # ÚNICO LOOP (LOOP 1)
      # ========================
      - name: Run Cyberpuerta scraper – SOLO LOOP 1
        env:
          # El script usará este valor para LOOP_INDEX
          CYBERPUERTA_LOOP_INDEX: "1"

          # Tiempo máximo POR EJECUCIÓN (en horas) → 5h40 aprox
          CYBERPUERTA_MAX_HOURS: "5.67"
          # Minutos de colchón antes de cortar (en minutos)
          CYBERPUERTA_GUARD_MINUTES: "10"

          # NO mandamos EMAIL_SENDER / EMAIL_PASSWORD / EMAIL_TO
          # para que el .py NO envíe correos ni adjuntos
        run: |
          echo "==== INICIANDO ÚNICO LOOP (1) ===="
          python scraper_cyberpuerta.py
